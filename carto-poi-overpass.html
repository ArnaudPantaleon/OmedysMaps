<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carto POI – CartoDB + Overpass</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --surface2: #f0ede8;
    --border: #e2ddd6;
    --text: #1a1916;
    --text2: #7a7670;
    --accent: #2563eb;
    --radius: 10px;
    --font: 'DM Sans', system-ui, sans-serif;
  }

  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap');

  body { font-family: var(--font); background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* ── HEADER ── */
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 10px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    z-index: 1000;
    flex-shrink: 0;
  }
  .logo { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; color: var(--text); }
  .logo span { color: var(--accent); }

  .search-wrap { flex: 1; max-width: 340px; position: relative; }
  .search-wrap input {
    width: 100%; padding: 7px 12px 7px 32px;
    border: 1px solid var(--border); border-radius: var(--radius);
    font-family: var(--font); font-size: 13px; color: var(--text);
    background: var(--surface2); outline: none;
    transition: border-color .15s;
  }
  .search-wrap input:focus { border-color: var(--accent); background: var(--surface); }
  .search-wrap svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); opacity: .4; }

  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .filter-btn {
    display: flex; align-items: center; gap: 5px;
    padding: 5px 10px; border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface); cursor: pointer;
    font-family: var(--font); font-size: 12px; font-weight: 500;
    color: var(--text2); transition: all .15s; white-space: nowrap;
  }
  .filter-btn .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .filter-btn.active { background: var(--surface2); color: var(--text); border-color: transparent; }
  .filter-btn:hover { border-color: #ccc; }

  #load-btn {
    margin-left: auto;
    padding: 7px 14px; border-radius: var(--radius);
    background: var(--accent); color: #fff;
    border: none; cursor: pointer;
    font-family: var(--font); font-size: 12px; font-weight: 600;
    transition: opacity .15s; white-space: nowrap; flex-shrink: 0;
  }
  #load-btn:hover { opacity: .85; }
  #load-btn:disabled { opacity: .5; cursor: default; }

  /* ── MAIN ── */
  .main { flex: 1; display: flex; overflow: hidden; }
  #map { flex: 1; }

  /* ── SIDEBAR ── */
  #sidebar {
    width: 300px; flex-shrink: 0;
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .sidebar-header {
    padding: 12px 14px 10px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .sidebar-header h2 { font-size: 13px; font-weight: 600; }
  #poi-count { font-size: 12px; color: var(--text2); }

  #poi-list { flex: 1; overflow-y: auto; }
  .poi-item {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 14px; border-bottom: 1px solid var(--border);
    cursor: pointer; transition: background .1s;
  }
  .poi-item:hover { background: var(--surface2); }
  .poi-icon { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; margin-top: 1px; }
  .poi-info { flex: 1; min-width: 0; }
  .poi-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
  .poi-type { font-size: 11px; color: var(--text2); margin-top: 1px; }
  .poi-addr { font-size: 11px; color: var(--text2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ── POPUP ── */
  .leaflet-popup-content-wrapper { border-radius: var(--radius) !important; box-shadow: 0 4px 24px rgba(0,0,0,.12) !important; border: 1px solid var(--border) !important; }
  .leaflet-popup-content { margin: 12px 14px !important; }
  .popup-title { font-size: 13px; font-weight: 600; color: var(--text); }
  .popup-type { font-size: 11px; color: var(--text2); margin-top: 2px; }
  .popup-tags { margin-top: 8px; display: flex; flex-direction: column; gap: 3px; }
  .popup-tag { font-size: 11px; color: var(--text2); display: flex; gap: 6px; }
  .popup-tag b { color: var(--text); font-weight: 500; min-width: 60px; }

  /* ── STATUS BAR ── */
  #status {
    position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
    background: rgba(26,25,22,.82); color: #fff; backdrop-filter: blur(6px);
    padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 500;
    z-index: 900; pointer-events: none; opacity: 0; transition: opacity .2s;
    white-space: nowrap;
  }
  #status.visible { opacity: 1; }

  /* ── LOADER SPINNER ── */
  .spinner {
    display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.3); border-top-color: #fff;
    animation: spin .7s linear infinite; margin-right: 6px; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Leaflet marker custom */
  .poi-marker {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; border: 2px solid white;
    box-shadow: 0 2px 6px rgba(0,0,0,.25);
  }

  .empty-state { padding: 32px 14px; text-align: center; color: var(--text2); font-size: 13px; line-height: 1.6; }
  .empty-state svg { margin-bottom: 8px; opacity: .3; }
</style>
</head>
<body>

<header>
  <div class="logo">Carto<span>POI</span></div>

  <div class="search-wrap">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="search-input" placeholder="Rechercher une ville, adresse…"/>
  </div>

  <div class="filters" id="filters">
    <button class="filter-btn active" data-type="pharmacy" title="Pharmacies">
      <span class="dot" style="background:#e74c3c"></span>Pharmacies
    </button>
    <button class="filter-btn active" data-type="doctors" title="Médecins">
      <span class="dot" style="background:#3498db"></span>Médecins
    </button>
    <button class="filter-btn active" data-type="hospital" title="Hôpitaux">
      <span class="dot" style="background:#9b59b6"></span>Hôpitaux
    </button>
    <button class="filter-btn active" data-type="shop" title="Commerces">
      <span class="dot" style="background:#f39c12"></span>Commerces
    </button>
    <button class="filter-btn active" data-type="restaurant" title="Restaurants">
      <span class="dot" style="background:#27ae60"></span>Restauration
    </button>
  </div>

  <button id="load-btn">Charger les POI</button>
</header>

<div class="main">
  <div id="map"></div>
  <div id="sidebar">
    <div class="sidebar-header">
      <h2>Points d'intérêt</h2>
      <span id="poi-count">—</span>
    </div>
    <div id="poi-list">
      <div class="empty-state">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <p>Naviguez sur la carte puis cliquez <strong>Charger les POI</strong> pour afficher les points d'intérêt de la zone visible.</p>
      </div>
    </div>
  </div>
</div>

<div id="status"></div>

<script>
// ── CONFIG ──────────────────────────────────────────────────────────────
const POI_CONFIG = {
  pharmacy:   { label: 'Pharmacie',    emoji: '💊', color: '#e74c3c', bg: '#fdecea', query: 'node["amenity"="pharmacy"]' },
  doctors:    { label: 'Médecin',      emoji: '🩺', color: '#3498db', bg: '#e8f4fd', query: 'node["amenity"="doctors"]' },
  hospital:   { label: 'Hôpital',      emoji: '🏥', color: '#9b59b6', bg: '#f5eef8', query: 'node["amenity"="hospital"]' },
  shop:       { label: 'Commerce',     emoji: '🛍', color: '#f39c12', bg: '#fef9e7', query: 'node["shop"]' },
  restaurant: { label: 'Restauration', emoji: '🍽', color: '#27ae60', bg: '#eafaf1',
    query: '(node["amenity"="restaurant"];node["amenity"="cafe"];node["amenity"="bar"];node["amenity"="fast_food"];)' }
};

// ── CARTE ────────────────────────────────────────────────────────────────
const map = L.map('map', { zoomControl: false }).setView([48.8566, 2.3522], 15);

L.control.zoom({ position: 'topleft' }).addTo(map);

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors © <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

// ── ÉTAT ─────────────────────────────────────────────────────────────────
let poiLayers = {};     // type → L.LayerGroup
let allPOIs   = [];
let activeTypes = new Set(Object.keys(POI_CONFIG));

// Init layer groups
Object.keys(POI_CONFIG).forEach(type => {
  poiLayers[type] = L.layerGroup().addTo(map);
});

// ── STATUT ───────────────────────────────────────────────────────────────
function showStatus(msg, duration = 2500) {
  const el = document.getElementById('status');
  el.innerHTML = msg;
  el.classList.add('visible');
  if (duration > 0) setTimeout(() => el.classList.remove('visible'), duration);
}
function hideStatus() { document.getElementById('status').classList.remove('visible'); }

// ── FILTRES ──────────────────────────────────────────────────────────────
document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  const type = btn.dataset.type;
  btn.classList.toggle('active');
  if (activeTypes.has(type)) { activeTypes.delete(type); poiLayers[type].clearLayers(); }
  else { activeTypes.add(type); }
  renderSidebar();
});

// ── SEARCH ───────────────────────────────────────────────────────────────
let searchTimer;
document.getElementById('search-input').addEventListener('input', e => {
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  if (q.length < 3) return;
  searchTimer = setTimeout(() => geocode(q), 500);
});

async function geocode(q) {
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1`);
    const data = await r.json();
    if (data.length) {
      map.setView([parseFloat(data[0].lat), parseFloat(data[0].lon)], 16);
      showStatus('📍 ' + data[0].display_name.split(',').slice(0,2).join(', '));
    }
  } catch(e) {}
}

// ── CHARGEMENT OVERPASS ──────────────────────────────────────────────────
document.getElementById('load-btn').addEventListener('click', loadPOIs);

async function loadPOIs() {
  const btn = document.getElementById('load-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Chargement…';
  showStatus('<span class="spinner"></span>Interrogation Overpass API…', -1);

  const b = map.getBounds();
  const bbox = `${b.getSouth().toFixed(5)},${b.getWest().toFixed(5)},${b.getNorth().toFixed(5)},${b.getEast().toFixed(5)}`;

  // Vider les couches actives
  activeTypes.forEach(type => poiLayers[type].clearLayers());
  allPOIs = [];

  const queries = [...activeTypes].map(type => `${POI_CONFIG[type].query}(${bbox});`).join('\n');
  const overpassQuery = `[out:json][timeout:30];\n(\n${queries}\n);\nout body;`;

  try {
    const resp = await fetch('https://overpass-api.de/api/interpreter', {
      method: 'POST',
      body: overpassQuery
    });
    if (!resp.ok) throw new Error('Overpass error ' + resp.status);
    const data = await resp.json();

    data.elements.forEach(node => {
      if (!node.lat || !node.lon) return;
      const type = detectType(node.tags);
      if (!type || !activeTypes.has(type)) return;

      const cfg = POI_CONFIG[type];
      const name = node.tags.name || cfg.label;

      // Marqueur custom
      const icon = L.divIcon({
        className: '',
        html: `<div class="poi-marker" style="background:${cfg.bg};border-color:${cfg.color};font-size:14px;">${cfg.emoji}</div>`,
        iconSize: [28, 28], iconAnchor: [14, 14], popupAnchor: [0, -16]
      });

      const marker = L.marker([node.lat, node.lon], { icon })
        .bindPopup(buildPopup(node.tags, name, cfg), { maxWidth: 240 });

      poiLayers[type].addLayer(marker);

      allPOIs.push({ name, type, tags: node.tags, lat: node.lat, lon: node.lon, marker });
    });

    showStatus(`✓ ${allPOIs.length} POI chargés`);
    renderSidebar();
  } catch(err) {
    showStatus('⚠ Erreur Overpass : ' + err.message);
  }

  btn.disabled = false;
  btn.textContent = 'Charger les POI';
}

// ── DÉTECTION TYPE ────────────────────────────────────────────────────────
function detectType(tags) {
  if (tags.amenity === 'pharmacy') return 'pharmacy';
  if (tags.amenity === 'doctors' || tags.amenity === 'clinic') return 'doctors';
  if (tags.amenity === 'hospital') return 'hospital';
  if (['restaurant','cafe','bar','fast_food','pub'].includes(tags.amenity)) return 'restaurant';
  if (tags.shop) return 'shop';
  return null;
}

// ── POPUP ─────────────────────────────────────────────────────────────────
function buildPopup(tags, name, cfg) {
  const fields = [
    ['Adresse', [tags['addr:housenumber'], tags['addr:street']].filter(Boolean).join(' ')],
    ['Téléphone', tags.phone || tags['contact:phone']],
    ['Horaires', tags.opening_hours],
    ['Site', tags.website ? `<a href="${tags.website}" target="_blank" style="color:var(--accent)">Voir le site</a>` : null],
  ].filter(f => f[1]);

  return `
    <div class="popup-title">${name}</div>
    <div class="popup-type">${cfg.emoji} ${cfg.label}</div>
    ${fields.length ? `<div class="popup-tags">${fields.map(f=>`<div class="popup-tag"><b>${f[0]}</b>${f[1]}</div>`).join('')}</div>` : ''}
  `;
}

// ── SIDEBAR ───────────────────────────────────────────────────────────────
function renderSidebar() {
  const list = document.getElementById('poi-list');
  const count = document.getElementById('poi-count');
  const visible = allPOIs.filter(p => activeTypes.has(p.type));

  count.textContent = visible.length ? `${visible.length} résultats` : '—';

  if (!visible.length) {
    list.innerHTML = `<div class="empty-state"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg><p>Aucun POI. Cliquez <strong>Charger les POI</strong> sur la zone souhaitée.</p></div>`;
    return;
  }

  // Tri alpha
  const sorted = [...visible].sort((a,b) => a.name.localeCompare(b.name, 'fr'));

  list.innerHTML = sorted.map((p, i) => {
    const cfg = POI_CONFIG[p.type];
    const addr = [p.tags['addr:housenumber'], p.tags['addr:street']].filter(Boolean).join(' ');
    return `
      <div class="poi-item" data-idx="${i}" onclick="flyTo(${p.lat},${p.lon},${i})">
        <div class="poi-icon" style="background:${cfg.bg};font-size:14px;">${cfg.emoji}</div>
        <div class="poi-info">
          <div class="poi-name">${p.name}</div>
          <div class="poi-type">${cfg.label}</div>
          ${addr ? `<div class="poi-addr">${addr}</div>` : ''}
        </div>
      </div>
    `;
  }).join('');

  // Stocker référence pour flyTo
  window._sortedPOIs = sorted;
}

window.flyTo = function(lat, lon, idx) {
  map.setView([lat, lon], 17, { animate: true });
  if (window._sortedPOIs && window._sortedPOIs[idx]) {
    window._sortedPOIs[idx].marker.openPopup();
  }
};
</script>
</body>
</html>
